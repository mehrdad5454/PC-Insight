[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-insight"
description = "Local-first PC diagnostics and storage analysis for Windows 10/11"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "PC Insight" }]
keywords = ["windows", "diagnostics", "monitoring", "storage", "pyside6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows 10",
    "Operating System :: Microsoft :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "PySide6-Addons==6.12.0",
    "psutil==7.2.2",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
pc-insight = "pcinsight.app:main"

[tool.setuptools.dynamic]
version = { attr = "pcinsight.__version__" }

[tool.setuptools.packages.find]
include = ["pcinsight*"]

[tool.setuptools.package-data]
pcinsight = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]